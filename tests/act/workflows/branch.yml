name: Test branch-validation
on:
  pull_request:
  push:
jobs:
  default-pattern:
    if: ${{ !github.event.test_pattern }}
    uses: ./.github/workflows/branch-validation.yml
  custom-pattern:
    if: ${{ github.event.test_pattern != '' }}
    uses: ./.github/workflows/branch-validation.yml
    with:
      pattern: ${{ github.event.test_pattern }}
